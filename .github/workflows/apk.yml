name: build apk

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: build
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: name it
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/pocketcode.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: pocketcode-apk
          path: out/pocketcode.apk

      - name: publish a release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest out/pocketcode.apk \
            --title "PocketCode V1" \
            --notes "Install the engine in Termux first:
          \`npm i -g github:${{ github.repository }}\` then \`pocketcode\`.
          Then install this APK and tap Start."
